<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRS CIS League | Support</title><style>
:root{--bg:#0b0a14;--card:#14122a;--line:#2a2650;--pri:#5b3df5;--pri2:#8b6bff;--txt:#eceaff;--mut:#9a96c4}
*{box-sizing:border-box}
body{margin:0;color:var(--txt);font:16px/1.5 Inter,system-ui,sans-serif;background:radial-gradient(900px 400px at 80% -10%,#3a22b8 0,transparent 70%),var(--bg)}
.wrap{max-width:780px;margin:0 auto;padding:24px 16px 64px}
nav{display:flex;justify-content:space-between;padding:8px 0 24px;font-weight:900;letter-spacing:.05em;text-transform:uppercase}
nav a{color:var(--pri2);text-decoration:none}
.hero{background:linear-gradient(120deg,#3a22c4,#6d4dff);border-radius:16px;padding:40px 28px}
h1{margin:0;font-size:clamp(32px,7vw,56px);font-weight:900;text-transform:uppercase;line-height:1}
.hero p{margin:10px 0 0;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:12px;padding:20px;margin:16px 0}
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.07em}
input,select,textarea{width:100%;background:#0e0c20;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:11px 12px;font:inherit}
textarea{min-height:110px;resize:vertical}
button,.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin:10px 8px 0 0}
button.alt,.btn.alt{background:#262250}
.chip{font-size:11px;padding:2px 9px;border-radius:99px;background:#262250;color:var(--pri2);font-weight:800;text-transform:uppercase}
.msg{padding:10px 12px;border-radius:8px;margin:8px 0;background:#0e0c20;white-space:pre-wrap}
.msg.admin{border-left:3px solid var(--pri2)}
small,footer{color:var(--mut)}
footer{margin-top:32px;font-size:13px;text-align:center}
.hp{position:absolute;left:-9999px}
</style></head><body><div class="wrap">
<nav><span>TRS CIS League</span><a href="https://trscisleague.vercel.app/">← Main site</a></nav>
<div class="hero"><h1>Support</h1><p>Appeal a moderation, report a player, ask a question, share a suggestion or report a bug.</p></div>
<div id="app"><form class="card" id="f">
<label>Discord username</label><input name="discord" maxlength="64" required placeholder="username">
<label>Category</label><select name="category"><option>Appeal a moderation</option><option>Report a player</option><option>Ask a question</option><option>Share a suggestion</option><option>Report a bug</option></select>
<label>Subject</label><input name="subject" maxlength="120" required>
<label>Reason / details</label><textarea name="message" maxlength="2000" required></textarea>
<input class="hp" name="website" tabindex="-1" autocomplete="off">
<button>Submit ticket</button> <small id="err"></small></form></div>
<footer>TRS CIS Sports Administration</footer></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q=new URLSearchParams(location.search),id=q.get('id'),t=q.get('t');
const post=b=>fetch('/api/ticket',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>({ok:r.ok,d:await r.json()}));
async function view(){
  const r=await fetch(`/api/ticket?id=${id}&t=${t}`);if(!r.ok){$('#app').innerHTML='<div class="card">Ticket not found.</div>';return}
  const d=await r.json();
  $('#app').innerHTML=`<div class="card"><span class="chip">${d.status}</span> <b>#${d.id}</b> · ${esc(d.category)}<h3>${esc(d.subject)}</h3>`+
  d.messages.map(m=>`<div class="msg ${m.from}"><small>${m.from==='admin'?'TRS CIS Staff':esc(d.discord)} · ${new Date(m.at).toLocaleString()}</small><br>${esc(m.text)}</div>`).join('')+
  (d.status!=='closed'?'<label>Reply</label><textarea id="r"></textarea><button id="s">Send</button>':'')+
  '<p><small>Save this page link — it is the only way to open your ticket.</small></p></div>';
  const s=$('#s');if(s)s.onclick=async()=>{const text=$('#r').value;if(text.trim()){await post({id,t,text});view()}};
}
if(id&&t)view();else $('#f').onsubmit=async e=>{e.preventDefault();
  const {ok,d}=await post(Object.fromEntries(new FormData(e.target)));
  if(ok)location.href=`/?id=${d.id}&t=${d.token}`;else $('#err').textContent=d.error;};
</script></body></html>
